# 운영 배포용 — 서버에서 빌드하지 않고 GitLab Container Registry 이미지를 pull 해서 실행한다.
#
#   배포 : ci/deploy.sh (CI 의 deploy 잡이 실행)
#   롤백 : IMAGE_TAG=<이전-short-sha> docker compose -f docker-compose.prod.yml up -d
#
# 주의: 반드시 /home/ec2-user/saffir_web 에서 실행할 것.
#       compose 프로젝트명(디렉토리명)이 바뀌면 postgres_data 볼륨이 새로 생성되어 DB 가 비어 버린다.

services:
  frontend:
    image: ${REGISTRY:-registry.gitlab.com/saffir_agency/saffir_web}/nginx:${IMAGE_TAG:-latest}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      web:
        condition: service_started
      server:
        condition: service_healthy
    restart: unless-stopped

  web:
    image: ${REGISTRY:-registry.gitlab.com/saffir_agency/saffir_web}/web:${IMAGE_TAG:-latest}
    environment:
      NODE_ENV: production
      # 서버 컴포넌트(SSR)가 NestJS 를 직접 호출할 때 쓰는 내부 주소
      API_URL: "http://server:4000"
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped

  server:
    image: ${REGISTRY:-registry.gitlab.com/saffir_agency/saffir_web}/server:${IMAGE_TAG:-latest}
    ports:
      - "4000:4000"
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      PORT: "4000"
      DATABASE_URL: postgresql://${POSTGRES_USER:-saffir}:${POSTGRES_PASSWORD:-saffir_pw}@db:5432/${POSTGRES_DB:-saffir}
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-saffir}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-saffir_pw}
      POSTGRES_DB: ${POSTGRES_DB:-saffir}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
      - ./db:/db:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-saffir}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  uploads_data:
